<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callback — enablebanking-poc (KOS)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; color: #222; }
  code { background: #f4f4f4; padding: 0.15rem 0.4rem; border-radius: 4px; word-break: break-all; }
  #code { font-size: 1.1rem; font-weight: bold; }
</style>
</head>
<body>
<h1>Autorización recibida</h1>
<p>Esta página no hace nada por sí sola — es solo el destino del redirect de
Enable Banking/CaixaBank tras autorizar. Copia el valor de <code>code</code>
de abajo y pégalo en:</p>
<pre>uv run poc.py fetch --code &lt;CODE&gt;</pre>

<p>Código detectado en la URL: <span id="code">(leyendo...)</span></p>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  document.getElementById("code").textContent = code || "(no se encontró 'code' en la URL — revisa la barra de direcciones completa)";
</script>
</body>
</html>
